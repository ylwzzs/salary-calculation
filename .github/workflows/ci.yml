name: Test

# ═══════════════════════════════════════════════════════════════
# 迁移到 openship 后(2026-08-07),build/deploy 由 openship 在生产机构建+部署
# (含 lesson.hookflow.cn edge/TLS)。本 workflow 仅保留 test(美国 runner)。
# 详见 docs/openship-platform 的 salary 迁移文档。
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ───────── 测试(GitHub 美国 runner,网络无限制)─────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -e ".[dev,web]"
      - run: pytest -q

      # 前端类型检查 + 构建(H4:防前端类型错误/构建失败悄悄合 main)
      # vitest 因 vitest4+jsdom+node 环境兼容问题暂缓,待修后加 npx vitest run
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build (tsc + vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build
